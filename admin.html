<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FurniLoop Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 3px 15px #0001;
}
input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:15px;
}
button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
}
button:hover{
  opacity:.9;
}
.preview{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
  display:none;
}
.product{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}
.product img{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:8px;
}
.delete{
  background:#d32f2f;
}
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.stat{
  background:#fafafa;
  padding:15px;
  border-radius:10px;
  text-align:center;
}
.stat b{
  display:block;
  font-size:24px;
  margin-top:5px;
}
</style>
</head>

<body>

<header>🪑 FurniLoop Admin</header>

<div class="container">

<div class="card">
<h2>📊 Dashboard</h2>

<div class="stats">
<div class="stat">
Products
<b id="productCount">0</b>
</div>

<div class="stat">
Orders
<b id="orderCount">0</b>
</div>

<div class="stat">
Visitors
<b id="visitorCount">0</b>
</div>

<div class="stat">
Profit
<b>₹<span id="profitTotal">0</span></b>
</div>
</div>
</div>


<div class="card">

<h2>➕ Add Furniture</h2>

<input id="name" placeholder="Furniture name">

<select id="category">
<option value="">Select Category</option>
<option>Sofa</option>
<option>Bed</option>
<option>Chair</option>
<option>Table</option>
<option>Almirah</option>
<option>Other</option>
</select>

<input id="purchase" type="number" placeholder="Purchase price ₹">

<input id="selling" type="number" placeholder="Selling price ₹">

<input id="location" placeholder="Location">

<select id="condition">
<option value="">Condition</option>
<option>Like New</option>
<option>Good</option>
<option>Used</option>
</select>

<label><b>Furniture Photo</b></label>
<input id="imageFile" type="file" accept="image/*">

<img id="preview" class="preview">

<button onclick="addFurniture()">Add Furniture</button>

<p id="message"></p>

</div>


<div class="card">

<h2>🪑 Furniture List</h2>

<div id="products"></div>

</div>


<div class="card">

<h2>📦 Orders</h2>

<div id="orders"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://xrtbizswrxbccyqmzetw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iQVUPQExXfCCm4NSxDZ-Dg_AOhTpVTw";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// IMAGE PREVIEW

document.getElementById("imageFile")
.addEventListener("change", function(){

const file = this.files[0];

if(!file) return;

const preview = document.getElementById("preview");

preview.src = URL.createObjectURL(file);

preview.style.display = "block";

});


// ADD FURNITURE

async function addFurniture(){

const name =
document.getElementById("name").value.trim();

const category =
document.getElementById("category").value;

const purchase =
Number(document.getElementById("purchase").value);

const selling =
Number(document.getElementById("selling").value);

const location =
document.getElementById("location").value.trim();

const condition =
document.getElementById("condition").value;

const file =
document.getElementById("imageFile").files[0];

const message =
document.getElementById("message");


if(!name || !category || !selling || !file){

message.innerText =
"⚠️ Name, category, selling price and photo required.";

return;

}


message.innerText =
"⏳ Photo uploading...";


// SAFE FILE NAME

const safeName =
file.name.replace(/[^\w.-]/g,"-");

const filePath =
Date.now() + "-" + safeName;


// UPLOAD IMAGE

const {data:uploadData,error:uploadError}
=
await db.storage
.from("furniture-images")
.upload(filePath,file,{
upsert:false
});


if(uploadError){

console.error(uploadError);

message.innerText =
"❌ Image upload failed: " +
uploadError.message;

return;

}


// PUBLIC IMAGE URL

const {data:urlData}
=
db.storage
.from("furniture-images")
.getPublicUrl(filePath);

const imageUrl =
urlData.publicUrl;


// SAVE PRODUCT

const {error}
=
await db
.from("products")
.insert([{

name:name,

category:category,

purchase_price:purchase || 0,

selling_price:selling,

location:location,

condition:condition,

image:imageUrl

}]);


if(error){

console.error(error);

message.innerText =
"❌ Product save failed: " +
error.message;

return;

}


message.innerText =
"✅ Furniture added successfully!";


// CLEAR FORM

document.getElementById("name").value="";
document.getElementById("category").value="";
document.getElementById("purchase").value="";
document.getElementById("selling").value="";
document.getElementById("location").value="";
document.getElementById("condition").value="";
document.getElementById("imageFile").value="";

document.getElementById("preview").style.display="none";


loadProducts();

loadStats();

}


// LOAD PRODUCTS

async function loadProducts(){

const {data,error}
=
await db
.from("products")
.select("*")
.order("id",{ascending:false});


if(error){

console.log(error);

return;

}


const box =
document.getElementById("products");

box.innerHTML="";


data.forEach(p=>{

const profit =
Number(p.selling_price || 0)
-
Number(p.purchase_price || 0);


box.innerHTML += `

<div class="product">

${p.image ?
`<img src="${p.image}">`
:
""}

<h3>${p.name}</h3>

<p>Category: ${p.category}</p>

<p>Purchase: ₹${p.purchase_price || 0}</p>

<p>Selling: ₹${p.selling_price || 0}</p>

<p>Profit: ₹${profit}</p>

<p>Location: ${p.location || "-"}</p>

<p>Condition: ${p.condition || "-"}</p>

<button class="delete"
onclick="deleteProduct(${p.id})">
Delete
</button>

</div>

`;

});

}


// DELETE PRODUCT

async function deleteProduct(id){

if(!confirm("Delete this furniture?")) return;


const {error}
=
await db
.from("products")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadProducts();

loadStats();

}


// LOAD ORDERS

async function loadOrders(){

const {data,error}
=
await db
.from("orders")
.select("*")
.order("id",{ascending:false});


if(error){

console.log(error);

return;

}


const box =
document.getElementById("orders");

box.innerHTML="";


data.forEach(o=>{

box.innerHTML += `

<div class="product">

<h3>Order #${o.id}</h3>

<p>Customer: ${o.customer_name}</p>

<p>Phone: ${o.customer_phone}</p>

<p>Address: ${o.address || "-"}</p>

<p>Payment: ${o.payment_method}</p>

<p>Status: ${o.status}</p>

</div>

`;

});

}


// DASHBOARD STATS

async function loadStats(){

const products =
await db
.from("products")
.select("purchase_price,selling_price");


document.getElementById("productCount")
.innerText =
products.data?.length || 0;


let totalProfit = 0;


(products.data || []).forEach(p=>{

totalProfit +=
Number(p.selling_price || 0)
-
Number(p.purchase_price || 0);

});


document.getElementById("profitTotal")
.innerText =
totalProfit;


const orders =
await db
.from("orders")
.select("id");


document.getElementById("orderCount")
.innerText =
orders.data?.length || 0;


const visitors =
await db
.from("visitors")
.select("id");


document.getElementById("visitorCount")
.innerText =
visitors.data?.length || 0;

}


// START

loadProducts();

loadOrders();

loadStats();

</script>

</body>
</html>
