<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FurniLoop - Second Hand Furniture</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#5b341c;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}
.categories button{
  border:0;
  background:white;
  padding:10px 14px;
  border-radius:20px;
  white-space:nowrap;
  box-shadow:0 2px 6px #ddd;
}

.card{
  background:white;
  border-radius:14px;
  margin-bottom:18px;
  overflow:hidden;
  box-shadow:0 2px 10px #ddd;
}

.card img{
  width:100%;
  height:230px;
  object-fit:cover;
}

.info{padding:15px}
.info h2{margin:0 0 8px}
.price{
  font-size:22px;
  font-weight:bold;
  color:#16803c;
}
.details{
  line-height:1.7;
  margin:8px 0;
}
.available{
  color:green;
  font-weight:bold;
}
.sold{
  color:red;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.buttons a,.buttons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:8px;
  text-align:center;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
}
.call{background:#198754;color:white}
.whatsapp{background:#25D366;color:white}
.interest{background:#ffe0e0;color:#c00}

.empty{
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <h1>🪑 FurniLoop</h1>
  <p>Second-Hand Furniture in Tripura</p>
</header>

<div class="container">

<input
  id="search"
  class="search"
  type="text"
  placeholder="🔍 Search furniture..."
  onkeyup="showProducts()"
>

<div class="categories">
  <button onclick="filterCategory('All')">All</button>
  <button onclick="filterCategory('Sofa')">🛋️ Sofa</button>
  <button onclick="filterCategory('Bed')">🛏️ Bed</button>
  <button onclick="filterCategory('Chair')">🪑 Chair</button>
  <button onclick="filterCategory('Table')">🪵 Table</button>
  <button onclick="filterCategory('Almirah')">🚪 Almirah</button>
</div>

<div id="products"></div>

</div>

<script>

const phone = "916909988186";

let selectedCategory = "All";

const products = [

{
name:"Sofa Set",
category:"Sofa",
price:"₹8,500",
location:"Agartala, Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc"
},

{
name:"Double Bed",
category:"Bed",
price:"₹9,000",
location:"Agartala, Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"
},

{
name:"Dining Table",
category:"Table",
price:"₹4,500",
location:"Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1617098900591-3f90928e8c54"
},

{
name:"Wooden Chair",
category:"Chair",
price:"₹1,200",
location:"Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1503602642458-232111445657"
},

{
name:"Almirah",
category:"Almirah",
price:"₹5,500",
location:"Agartala, Tripura",
condition:"Used",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1558997519-83ea9252edf8"
},

{
name:"Dressing Table",
category:"Table",
price:"₹4,000",
location:"Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6"
},

{
name:"Bookshelf",
category:"Table",
price:"₹2,500",
location:"Agartala, Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1594620302200-9a762244a156"
},

{
name:"Single Bed",
category:"Bed",
price:"₹5,000",
location:"Tripura",
condition:"Clean Used",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"
},

{
name:"Wooden Table",
category:"Table",
price:"₹3,000",
location:"Agartala, Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc"
},

{
name:"Wooden Cabinet",
category:"Almirah",
price:"₹3,500",
location:"Tripura",
condition:"Good",
status:"Available",
delivery:"Available",
image:"https://images.unsplash.com/photo-1595428774223-ef52624120d2"
}

];

function showProducts(){

const search =
document.getElementById("search").value.toLowerCase();

const box =
document.getElementById("products");

let html="";

const filtered = products.filter(p => {

const matchSearch =
p.name.toLowerCase().includes(search);

const matchCategory =
selectedCategory === "All" ||
p.category === selectedCategory;

return matchSearch && matchCategory;

});

if(filtered.length===0){
box.innerHTML =
'<div class="empty">😔 Furniture not found</div>';
return;
}

filtered.forEach((p,index)=>{

const statusClass =
p.status==="Available" ? "available" : "sold";

html += `

<div class="card">

<img src="${p.image}" alt="${p.name}">

<div class="info">

<h2>${p.name}</h2>

<div class="price">${p.price}</div>

<div class="details">

📍 <b>Location:</b> ${p.location}<br>

🛠️ <b>Condition:</b> ${p.condition}<br>

<span class="${statusClass}">
${p.status==="Available" ? "🟢" : "🔴"} ${p.status}
</span><br>

🚚 <b>Delivery:</b> ${p.delivery}

</div>

<div class="buttons">

<a class="call"
href="tel:+${phone}">
📞 Call
</a>

<a class="whatsapp"
href="https://wa.me/${phone}?text=Hello%20FurniLoop,%20I%20am%20interested%20in%20${encodeURIComponent(p.name)}">
💬 WhatsApp
</a>

<button class="interest"
onclick="interested('${p.name}')">
❤️ Interested
</button>

</div>

</div>
</div>

`;

});

box.innerHTML=html;

}

function filterCategory(category){

selectedCategory=category;
showProducts();

}

function interested(name){

alert(
"❤️ Thank you! You are interested in " +
name +
". Please contact us by Call or WhatsApp."
);

}

showProducts();

</script>

</body>
</html>
