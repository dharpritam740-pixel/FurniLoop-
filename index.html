header{
  background:#6b4226;
  color:white;
  text-align:center;
  padding:20px 10px;
}

h1{margin:0 0 6px;}
.subtitle{font-size:14px;}

.search{
  width:90%;
  max-width:500px;
  margin:18px auto;
  display:block;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.categories{
  text-align:center;
  margin:10px;
}

.categories button{
  margin:4px;
  padding:9px 14px;
  border:0;
  border-radius:20px;
  background:#ddd;
  cursor:pointer;
}

.container{
  width:94%;
  max-width:1000px;
  margin:auto;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #ccc;
}

.card img{
  width:100%;
  height:190px;
  object-fit:cover;
}

.card-content{
  padding:14px;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#087f23;
}

.info{
  font-size:14px;
  line-height:1.6;
}

.status{
  color:green;
  font-weight:bold;
}

.card button{
  width:100%;
  padding:11px;
  margin-top:7px;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

.call{
  background:#25a244;
  color:white;
}

.whatsapp{
  background:#20c76a;
  color:white;
}

.interested{
  background:#ff9800;
  color:white;
}

.review-box{
  background:white;
  margin:30px auto;
  padding:20px;
  width:90%;
  max-width:650px;
  border-radius:12px;
  box-shadow:0 2px 8px #ccc;
}

.review-box input,
.review-box select,
.review-box textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.review-box textarea{
  height:100px;
  resize:none;
}

.review-box button{
  width:100%;
  padding:12px;
  background:#6b4226;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
}

.review-item{
  margin-top:15px;
  padding:12px;
  background:#f5f5f5;
  border-radius:8px;
}

footer{
  text-align:center;
  padding:20px;
  background:#333;
  color:white;
  margin-top:30px;
}
</style>
</head>

  <h1>FurniLoop</h1>
  <div class="subtitle">Second-Hand Furniture in Tripura</div>

  <button onclick="setCategory('Table')">Table</button>

<div class="container">

<div class="review-box">

  >

  <select id="reviewRating">

    <option value="3">⭐⭐⭐</option>
    <option value="2">⭐⭐</option>
    <option value="1">⭐</option>
  </select>

  <textarea
    id="reviewText"
    placeholder="Write your review"
  ></textarea>

  <button onclick="submitReview()">
    Submit Review
  </button>

  <div id="reviewList"></div>

</div>

<footer>
  © 2026 FurniLoop | Tripura
</footer>
