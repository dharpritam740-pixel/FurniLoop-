<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FurniLoop</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#222;color:white;text-align:center;padding:20px}
.container{padding:15px;max-width:700px;margin:auto}
.card{background:white;margin:15px 0;padding:15px;border-radius:12px;box-shadow:0 2px 8px #ccc}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.price{font-size:22px;font-weight:bold}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:7px;color:white;background:#222}
.whatsapp{background:#25D366}
input,select{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}
</style>
</head>

<body>

<header>
<h1>FurniLoop</h1>
<p>Second-hand Furniture</p>
</header>

<div class="container">

<input id="search" placeholder="Search furniture...">

<div class="card">
<img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80">
<h2>Second-hand Sofa</h2>
<p class="price">₹8,500</p>
<p>📍 Agartala, Tripura</p>
<p>Condition: Good</p>
<a href="tel:+916909981886"><button>📞 Call Now</button></a>
<a href="https://wa.me/916909981886" target="_blank">
<button class="whatsapp">💬 WhatsApp</button>
</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80">
<h2>Wooden Bed</h2>
<p class="price">₹6,000</p>
<p>📍 Tripura</p>
<p>Condition: Clean Used</p>
<a href="tel:+916909981886"><button>📞 Call Now</button></a>
<a href="https://wa.me/916909981886" target="_blank">
<button class="whatsapp">💬 WhatsApp</button>
</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1617806118233-18e1de247200?auto=format&fit=crop&w=800&q=80">
<h2>Dining Table</h2>
<p class="price">₹4,500</p>
<p>📍 Tripura</p>
<p>Condition: Good</p>
<a href="tel:+916909981886"><button>📞 Call Now</button></a>
<a href="https://wa.me/916909981886" target="_blank">
<button class="whatsapp">💬 WhatsApp</button>
</a>

</div>

</html>
